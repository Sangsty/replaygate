# Production stack: Postgres (private), the API (private) and Caddy (public, TLS).
#
#   cp deploy/prod.env.example .env.prod      # then edit it
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports. Postgres and the API are reachable from inside the
# compose network only.
name: replaygate-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-replaygate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-replaygate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The password is generated as hex (openssl rand -hex 24), so it is safe in a URL.
      DATABASE_URL: postgres://${POSTGRES_USER:-replaygate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-replaygate}?sslmode=disable
      RG_API_ADDR: ":8080"
      RG_PUBLIC_URL: ${RG_PUBLIC_URL:?set RG_PUBLIC_URL in .env.prod}
      RG_GITHUB_CLIENT_ID: ${RG_GITHUB_CLIENT_ID:-}
      RG_GITHUB_CLIENT_SECRET: ${RG_GITHUB_CLIENT_SECRET:-}
      RG_JWT_SECRET: ${RG_JWT_SECRET:-}

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      RG_HOST: ${RG_HOST:?set RG_HOST in .env.prod}
    ports:
      - "${RG_HTTP_PORT:-80}:80"
      - "${RG_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data      # certificates: keep them across restarts
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
