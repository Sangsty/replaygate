name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: replaygate
          POSTGRES_PASSWORD: replaygate
          POSTGRES_DB: replaygate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replaygate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://replaygate:replaygate@localhost:5432/replaygate_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build

  # Runs the real binaries against two demo apps with seeded bugs and fails if
  # the numbers are off, so a change that breaks detection or noise learning
  # cannot merge.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: replaygate
          POSTGRES_PASSWORD: replaygate
          POSTGRES_DB: replaygate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replaygate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: replaygate
      POSTGRES_PASSWORD: replaygate
      PGPASSWORD: replaygate
      PSQL_CMD: psql -h localhost -U replaygate
      E2E_DB_BASE: postgres://replaygate:replaygate@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y --no-install-recommends postgresql-client
      - run: bash scripts/e2e.sh

